<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Web Automation Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container state-idle" data-state="idle">
    <header class="header">
      <div class="status-dot" aria-hidden="true"></div>
      <div class="header-text">
        <h1>Automation Recorder <span id="buildVersion" class="build-version"></span></h1>
        <span id="stateLabel" class="state-label">Idle</span>
      </div>
    </header>
    
    <!-- URL corrente -->
    <div class="current-url">
      <span id="currentUrl">Caricamento...</span>
    </div>

    <!-- Controlli di registrazione -->
    <div class="controls">
      <button id="recordBtn" class="btn btn-circle btn-record" aria-pressed="false">
        <span class="icon-dot" aria-hidden="true"></span>
        <span class="btn-label">REC</span>
      </button>
      <button id="stopBtn" class="btn btn-circle btn-stop" disabled>
        <span class="icon-stop" aria-hidden="true"></span>
        <span class="btn-label">STOP</span>
      </button>
      <button id="playBtn" class="btn btn-circle btn-play" disabled aria-pressed="false">
        <span class="icon-play" aria-hidden="true"></span>
        <span class="btn-label">PLAY</span>
      </button>
    </div>

    <div class="settings-row">
      <label class="toggle-label" for="verboseLogsToggle">
        <input type="checkbox" id="verboseLogsToggle">
        <span>Verbose logs</span>
      </label>
    </div>
    <div class="settings-row settings-row-inline">
      <label class="toggle-label" for="smartWaitToggle">
        <input type="checkbox" id="smartWaitToggle">
        <span>Smart wait</span>
      </label>
      <label class="timeout-label" for="actionTimeoutMs">
        Timeout
        <input type="number" id="actionTimeoutMs" min="1000" max="30000" step="500" value="8000">
        ms
      </label>
    </div>

    <!-- Salvataggio automazione -->
    <div id="saveSection" class="save-section" style="display: none;">
      <input type="text" id="automationName" placeholder="Nome automazione (es. Compilazione form ordini)">
      <div class="save-actions">
        <button id="saveBtn" class="btn btn-save">Salva automazione</button>
        <button id="cancelBtn" class="btn btn-ghost">Annulla</button>
      </div>
    </div>

    <!-- Lista automazioni -->
    <div class="automations-section">
      <div class="section-title">
        <h2>Automazioni salvate</h2>
        <span id="automationCount" class="badge">0</span>
      </div>
      <div id="automationsList" class="automations-list">
        <p class="empty-message">Nessuna automazione registrata</p>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="status"></div>

    <footer class="footer">
      <button class="icon-btn" type="button" aria-label="Impostazioni">
        ⚙️
      </button>
      <button class="icon-btn icon-btn-danger" type="button" aria-label="Elimina">
        🗑️
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
